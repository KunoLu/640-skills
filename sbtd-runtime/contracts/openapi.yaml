openapi: 3.1.0
info:
  title: SBTD Runtime local API
  version: 1.0.0
  summary: "Contract draft for v2.1.0-rc.1. serve.py serves the operations it routes over local HTTP; operations marked x-sbtd-implementation: library have only in-process Python library surfaces under sbtd-runtime/. R1.4 acceptance pins event schema 1.0, QueryScope schema_version 1.0, and CSV export_schema_version 1.1; exports* stay v2.1.0-rc.2. The info-level x-sbtd-implementation: contract-only marks this document as the contract source; it does not state that no operation is implemented."
  x-sbtd-implementation: contract-only
  x-sbtd-release: v2.1.0-rc.1
  x-sbtd-not-implemented-before: R1.1
  description: |
    Local loopback API. The service binds only 127.0.0.1 and ::1. Binding any
    non-loopback address is forbidden. A browser exchanges a one-time pairing
    code for a short-lived session bearer. The long-term token stays in
    SBTD_RUNTIME_HOME with Unix mode 0600 and must not appear in a URL, log,
    or export. Unsafe methods require Host and Origin checks plus CSRF.
    Reserved scopes tasks:write, migration:apply, and remote command execution
    have no route in this draft.
  x-sbtd-auth:
    loopback: [127.0.0.1, "::1"]
    pairing: one-time header exchanged for a session bearer
    long_term_token: file only, mode 0600, never a query parameter
    csrf: required on POST and DELETE
    host_origin: reject external origins and DNS rebinding
    scope_checks: serve.py issues, stores, and checks no scopes; x-sbtd-scopes is declarative, each process pairs at most one session, and that session bearer alone authenticates /api/v1 requests other than health and pairing.
servers:
  - url: http://127.0.0.1:6400
    description: IPv4 loopback only
  - url: http://[::1]:6400
    description: IPv6 loopback only
tags:
  - name: auth
  - name: metadata
  - name: audit
  - name: stats
  - name: collection
  - name: export
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [metadata]
      summary: Liveness without a project list
      security: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Minimal liveness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/session/pair:
    post:
      operationId: pairSession
      tags: [auth]
      summary: Exchange a one-time pairing code for a short-lived session
      security:
        - pairingCode: []
      parameters:
        - $ref: "#/components/parameters/PairingCode"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Session bearer. Not a long-term token and not returned in a URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [metadata]
      security:
        - localSession: []
      x-sbtd-scopes: [metadata:read]
