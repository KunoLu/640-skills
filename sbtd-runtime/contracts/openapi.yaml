      operationId: getSnapshotDataset
      tags: [export]
      summary: Implemented as report_snapshot.SnapshotStore.dataset_page with snapshot-bound cursors; csv_export.serialize_csv walks the same full range (served over HTTP by serve.py).
      security:
        - localSession: []
      x-sbtd-scopes: [audit:read]
      parameters:
