        - $ref: "#/components/parameters/Cursor"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/Json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/v1/exports:
    post:
      operationId: createExport
      description: |
        After access checks (401/403) and request validation needed to identify a
        replay (400: JSON content type, required Idempotency-Key, and valid
        CreateExportRequest body), evaluate idempotent replay first. A replay is
        the same Idempotency-Key and canonical request body as a previously
        accepted createExport, within the store's retention of that idempotency
        record. Return the original HTTP 202 ExportAccepted with the original
        data.export_id and originally accepted meta.warnings; create no new job,
        export_id, or file, and do not re-run JPEG preflight.
        Only non-replay requests proceed to admission checks: renderer
        availability (jpeg/pdf 503 EXPORT_RENDERER_UNAVAILABLE), snapshot 404/410,
        disk quota (507 DISK_QUOTA_EXCEEDED), and JPEG image size
        (422 EXPORT_IMAGE_SIZE_LIMIT). A replay is not answered with these errors
        merely because renderer, snapshot, quota, or image-size limits changed
        after acceptance. The replay's own export may still be observed as
        expired/410 via getExport; that behavior is unchanged.
        This rule does not redefine the relative order among non-replay admission
        checks. The extension arrays classify codes relative to replay, not their
        order within each array. Same-key/different-payload behavior is unchanged.
      tags: [export]
      security:
        - localSession: []
      x-sbtd-scopes: [export:create]
      x-sbtd-release: v2.1.0-rc.2
      x-sbtd-rc1-blocking: false
      x-sbtd-idempotent-replay:
        response: "202"
        evaluated_after: ["400", "401", "403"]
        precedes: ["404", "410", "422", "503", "507"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExportRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "202":
          $ref: "#/components/responses/ExportAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ExportImageSizeLimit"
        "503":
          $ref: "#/components/responses/ExportRendererUnavailable"
        "507":
          $ref: "#/components/responses/DiskQuotaExceeded"
  /api/v1/exports/{export_id}:
    get:
      operationId: getExport
      tags: [export]
      security:
        - localSession: []
      x-sbtd-scopes: [export:read]
      x-sbtd-release: v2.1.0-rc.2
      x-sbtd-rc1-blocking: false
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/ExportStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
    delete:
      operationId: deleteExport
      tags: [export]
      security:
        - localSession: []
      x-sbtd-scopes: [export:create]
      x-sbtd-release: v2.1.0-rc.2
      x-sbtd-rc1-blocking: false
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExportId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "204":
          description: Cancelled or cleaned
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/v1/exports/{export_id}/file:
    get:
      operationId: downloadExport
      tags: [export]
      summary: Download by export id and the current session. No file path parameter.
      security:
        - localSession: []
      x-sbtd-scopes: [export:read]
      x-sbtd-release: v2.1.0-rc.2
      x-sbtd-rc1-blocking: false
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Authorized export bytes
          x-sbtd-csv-columns:
            - export_schema_version
            - snapshot_id
            - record_type
            - record_id
            - row_grain
            - range_from
            - range_to
            - timezone
            - as_of
            - metrics_version
            - project_id
            - repository_id
            - worktree_id
            - actor_id
            - actor_alias
            - host_kind
            - host_version
            - branch_alias
            - task_uid
            - logical_task_id
            - task_run_id
            - session_id
            - step_run_id
            - parent_step_run_id
            - component_id
            - component_kind
            - component_version
            - invocation_id
            - attempt_id
            - attempt_no
            - gate_id
            - gate_eval_id
            - gate_scope_revision
            - validation_run_id
            - case_id
            - artifact_id
            - event_id
            - event_type
            - source_id
            - source_event_id
            - occurred_at
            - recorded_at
            - started_at
            - ended_at
            - duration_ms
            - duration_basis
            - workflow_mode
            - mode_source
            - previous_status
            - status
            - raw_result
            - normalized_result
            - reason_code
            - operation_status
            - state_persisted
            - audit_status
            - applicability
            - evidence_status
            - observation_level
            - source_kind
            - validation_scope
            - tests_total
            - tests_passed
            - tests_failed
            - tests_skipped
            - tests_unknown
            - provider
            - model
            - billing_basis
            - currency
            - input_tokens
            - output_tokens
            - cache_read_tokens
            - cache_write_tokens
            - cost_reported
            - cost_estimated
            - metric_id
            - metric_value
            - unit
            - numerator
            - denominator
            - bucket_start
            - bucket_end
            - group_dimensions
            - workflow_source_revision
            - source_commit_sha
            - worktree_revision
            - task_document_revision
            - scope_revision
            - revision_state
            - relation_role
            - coverage_state
            - warning_code
            - metadata_key
            - metadata_value
            - reasoning_tokens
          x-sbtd-csv-schema-version: "1.1"
          x-sbtd-csv-column-notes:
            reasoning_tokens: "Appended last; existing column order unchanged. Subset of output_tokens; must not be added to output_tokens. When the host does not report it the value is null and the CSV cell is empty, never 0."
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
components:
  securitySchemes:
    localSession:
      type: http
      scheme: bearer
      bearerFormat: session
      description: Short-lived session from pairing. Not a long-term token.
    pairingCode:
      type: apiKey
      in: header
      name: X-Pairing-Code
      description: One-time pairing credential. Destroy after exchange.
  parameters:
    PairingCode:
      name: X-Pairing-Code
      in: header
      required: true
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    TaskUid:
      name: task_uid
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      description: |
        The pattern documents the runtime ID format. Malformed PATH IDs return
        404 NotFound (sbtd-runtime/report_snapshot.py:682–683;
        sbtd-runtime/serve.py get_snapshot / get_snapshot_dataset).
      schema:
        type: string
        pattern: "^snap_[0-9a-f]{32}$"
    ExportId:
      name: export_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Json:
      description: Versioned JSON envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    ExportAccepted:
      description: |
        Export accepted; use data.export_id to query or download the export.
        When createExport downgrades a JPEG export from 2x to 1x, this HTTP 202
        response carries the fixed-format warning string EXPORT_SCALE_DOWNGRADED:1x
        in meta.warnings as the user notice before generation.
        An idempotent replay returns the original data.export_id and originally
        accepted meta.warnings (including EXPORT_SCALE_DOWNGRADED:1x), without
        creating a new job or file or re-running JPEG preflight; see createExport's
        x-sbtd-idempotent-replay rule.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CreateExportAccepted"
    ExportStatus:
      description: Export job state, including a stable error code only when failed.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ExportJob"
    BadRequest:
      description: Invalid or missing request body, field type, export format, time, dimension, or metric. No silent default.
    Unauthorized:
      description: Missing credential or scope. Does not reveal whether a hidden object exists.
    NotFound:
      description: Missing or invisible object.
    Conflict:
      description: Same idempotency key with a different payload, or a source-event conflict.
    Forbidden:
      description: Rejected Host or Origin (external origin, DNS rebinding), or a failed CSRF check on an unsafe method. Does not reveal internal policy details.
    Gone:
      description: Snapshot expired. A new snapshot must not reuse the old id.
    ExportImageSizeLimit:
      description: |
        JPEG preflight failed before export acceptance or generation because
        the rendered image size or total pixel count would exceed the limit
        (PRD 13.5, AC-48). If a 2x render would exceed the limits, the runtime
        downgrades to 1x when content remains complete and the width is still
        at least the standard report width, with a user notice before generation
        via EXPORT_SCALE_DOWNGRADED:1x in meta.warnings of the createExport HTTP 202
        ExportAccepted response.
        Only if the 1x render still exceeds the limits is EXPORT_IMAGE_SIZE_LIMIT
        returned. No truncation, splitting into multiple files, partial or
        half-finished output, or false success.
        Limits report the values in effect; suggested preflight caps are 32,000 px
        per edge and 80 MP (80,000,000 pixels), not frozen pending measurement on
        target platforms and the user's decision. Use HTML/PDF or reduce displayed
        detail instead.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [detail, max_edge_px, max_total_pixels]
            properties:
              detail:
                type: string
                const: EXPORT_IMAGE_SIZE_LIMIT
              max_edge_px:
                type: integer
                minimum: 1
                description: Maximum supported width or height of the output image, in pixels.
              max_total_pixels:
                type: integer
                minimum: 1
                description: Maximum supported total pixel count of the output image.
    ExportRendererUnavailable:
      description: |
        The server-side renderer dependency is unavailable (PRD 9.6), for example
        Playwright, the chromium shell, or the optional extra is not installed.
        Applies only to formats requiring this renderer (jpeg, pdf); html/csv
        never return this error. The request is valid: this is HTTP 503 dependency
        unavailability, not a client request defect or the HTTP 422 image size limit.
        Returned synchronously before acceptance (HTTP 202): no job, no export_id,
        and no partial file. Semantics match capabilities reporting jpeg/pdf as
        unavailable with the reason; other export capabilities remain independent.
        Not returned for an idempotent replay of a previously accepted request;
        see createExport's x-sbtd-idempotent-replay rule.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [detail]
            properties:
              detail:
                type: string
                const: EXPORT_RENDERER_UNAVAILABLE
    DiskQuotaExceeded:
      description: |
        Shared snapshots/ + exports/ disk quota exceeded (PRD 10.4, ADR 0003
        sections 4/5). HTTP 507 Insufficient Storage (RFC 4918 section 11.5).
        Sweep first, then remeasure shared used bytes U; refuse a new snapshot
        or export only when U > the effective quota L. Exactly at the cap is
        not refused. This checks current usage, not a reservation for output
        not yet generated; it does not evict unexpired data.
        Returned synchronously before createExport acceptance (HTTP 202), for
        every format: no job, no export_id, and no file for this creation.
        For createReportSnapshot, refuse before HTTP 201; its current library
        surface must provide the equivalent refusal with these byte counts
        before creating a file. This declaration does not add an HTTP handler.
        Existing-ID reuse and idempotent replay are not new creates. For
        createExport, this error is not returned for an idempotent replay of a
        previously accepted request; see its x-sbtd-idempotent-replay rule.
        For createReportSnapshot, existing-ID reuse precedence relative to 507
        remains undefined. This is not an ExportJob failure code.
        used_bytes > quota_bytes is a semantic requirement; standard JSON Schema
        cannot compare these two fields. Return parsed numeric byte counts only,
        never the raw environment variable value or string.
        The 80% warning (5 * U >= 4 * L) has no meta.warnings code here:
        log-only / presentation handling belongs to R2.2.
        Invalid SBTD_RUNTIME_DISK_QUOTA_BYTES startup refusal is a process/CLI
        concern outside this OpenAPI contract.
        The queryStatistics contract also allows this response when its required
        snapshot write is refused by the shared quota; serve.py maps it to HTTP
        507 with this body (PR #167).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [detail, used_bytes, quota_bytes]
            properties:
              detail:
                type: string
                const: DISK_QUOTA_EXCEEDED
              used_bytes:
                type: integer
                minimum: 0
                description: Post-sweep shared usage U in bytes, summed from regular-file st_size in snapshots/ and exports/ per ADR 0003 section 4.
              quota_bytes:
                type: integer
                minimum: 1
                description: Effective shared cap L in bytes; currently defaults to 2000000000, configurable via SBTD_RUNTIME_DISK_QUOTA_BYTES and not frozen to that default.
  schemas:
    ExportJob:
      type: object
      required: [status, error]
      description: |
        Public export job view. Other job metadata remains optional and open.
        Failure codes apply to all export formats, including html/csv.
      properties:
        status:
          type: string
          enum: [queued, generating, ready, failed, cancelled]
        error:
          type: ["string", "null"]
          enum: [EXPORT_RENDER_TIMEOUT, EXPORT_RENDER_FAILED, null]
          description: |
            Non-null only when status is failed; null for every other status.
            Future job failures only add codes. Disk-capacity row 4 instead uses
            synchronous HTTP 507 DiskQuotaExceeded before acceptance, not this field.
            Clients must treat unknown codes as generic failure.
        warnings:
          $ref: "#/components/schemas/Meta/properties/warnings"
      if:
        properties:
          status:
            const: failed
      then:
        properties:
          error:
            type: string
      else:
        properties:
          error:
            type: "null"
    CreateExportAccepted:
      type: object
      additionalProperties: false
      required: [export_id]
      properties:
        export_id:
          $ref: "#/components/parameters/ExportId/schema"
    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [snapshot_id, format]
      description: |
        Fix the completed snapshot and presentation state at export selection
        time (PRD 13.2–13.3). Later refreshes or filter changes must not change
        this export. A malformed snapshot_id (failing the pattern) returns
        400 BadRequest; a well-formed but missing or invisible snapshot returns
        404; an expired snapshot returns 410, never an automatically selected
        replacement.
      properties:
        snapshot_id:
          $ref: "#/components/parameters/SnapshotId/schema"
          description: |
            Malformed (fails the pattern): 400 BadRequest. Well-formed but
            missing or invisible: 404. Expired: 410.
        format:
          type: string
          enum: [html, csv, jpeg, pdf]
        presentation_state:
          $ref: "#/components/schemas/ExportPresentationState"
          description: Optional; when omitted, use the existing ReportDocument default presentation state.
    ExportPresentationState:
      type: object
      additionalProperties: false
      required:
        - theme
        - report_width_px
        - expanded_detail_ids
        - table_sort
        - preview_row_sets
        - panel_order
        - legend_state
      description: |
        Complete presentation state matching Dashboard PresentationState
        (PRD 13.3). Affects rendering only, never the CSV dataset range.
        Hidden series must retain an explanatory note in the export.
      properties:
        theme:
          type: string
          enum: [dark, light]
          description: Report color theme.
        report_width_px:
          type: number
          minimum: 0
          description: Standard report width in CSS pixels.
        expanded_detail_ids:
          type: array
          items:
            type: string
          description: Identifiers of expanded detail objects.
        table_sort:
          type: object
          additionalProperties:
            type: string
          description: Table identifiers mapped to their current sort selection.
        preview_row_sets:
          type: object
          additionalProperties:
            type: number
            minimum: 0
          description: Table identifiers mapped to preview row counts; never a CSV row limit.
        panel_order:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: |
            Must be a complete, unique ordering of all panel IDs in
            sbtd-runtime/contracts/panel-manifest.json. Any other value
            (empty, duplicate, unknown, or missing IDs) is rejected with
            400 BadRequest. Membership and completeness are checked against
            the manifest by the service, not enumerated in this schema.
        legend_state:
          type: object
          additionalProperties:
            type: boolean
          description: Series identifiers mapped to their visibility state.
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    Session:
      type: object
      additionalProperties: false
      required: [token_type, access_token, expires_in]
      properties:
        token_type:
          const: bearer
        access_token:
          type: string
        expires_in:
          type: integer
          minimum: 1
    Envelope:
      type: object
      required: [api_version, request_id, data, meta]
      properties:
        api_version:
          const: "1"
        request_id:
          type: string
        data: {}
        meta:
          $ref: "#/components/schemas/Meta"
    Meta:
      type: object
      required: [metrics_version, projection_version, complete]
      properties:
        metrics_version:
          type: string
        projection_version:
          type: string
        complete:
          type: boolean
        coverage_state:
          type: string
        warnings:
          type: array
          description: |
            Warning strings; known fixed-format codes include EXPORT_SCALE_DOWNGRADED:1x,
            emitted by createExport in the HTTP 202 ExportAccepted response when a
            JPEG export is downgraded from 2x to 1x.
          items:
            type: string
        next_cursor:
          type: ["string", "null"]
    QueryScope:
      type: object
      additionalProperties: false
      required: [schema_version, range, metrics]
      properties:
        schema_version:
          const: "1.0"
        range:
          type: object
          required: [from, to, timezone]
          properties:
            from:
              type: string
            to:
              type: string
            timezone:
              type: string
        filters:
          type: object
        task_granularity:
          enum: [executable-leaf, all]
        include_unlinked:
          type: boolean
        include_unknown_time:
          type: boolean
        metrics:
          type: array
          items:
            type: string
    IngestBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            type: object
          description: Each item must validate against event.schema.json.
