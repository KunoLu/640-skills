  /api/v1/statistics/query:
    post:
      operationId: queryStatistics
      tags: [stats]
      x-sbtd-implementation: library
      summary: Implemented as stats_query.query over contract_eval.evaluate (in-process, no HTTP server).
      security:
        - localSession: []
      x-sbtd-scopes: [stats:read]
