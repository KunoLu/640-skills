openapi: 3.1.0
info:
  title: SBTD Runtime local API
  version: 1.0.0
  summary: "Contract draft for v2.1.0-rc.1. No server is implemented in this package; operations marked x-sbtd-implementation: library have in-process Python library surfaces under sbtd-runtime/. R1.4 acceptance pins event schema 1.0, QueryScope schema_version 1.0, and CSV export_schema_version 1.1; exports* stay v2.1.0-rc.2."
  x-sbtd-implementation: contract-only
  x-sbtd-release: v2.1.0-rc.1
  x-sbtd-not-implemented-before: R1.1
  description: |
    Local loopback API. The service binds only 127.0.0.1 and ::1. Binding any
    non-loopback address is forbidden. A browser exchanges a one-time pairing
    code for a short-lived session bearer. The long-term token stays in
    SBTD_RUNTIME_HOME with Unix mode 0600 and must not appear in a URL, log,
    or export. Unsafe methods require Host and Origin checks plus CSRF.
    Reserved scopes tasks:write, migration:apply, and remote command execution
    have no route in this draft.
  x-sbtd-auth:
    loopback: [127.0.0.1, "::1"]
    pairing: one-time header exchanged for a session bearer
    long_term_token: file only, mode 0600, never a query parameter
    csrf: required on POST and DELETE
    host_origin: reject external origins and DNS rebinding
servers:
  - url: http://127.0.0.1:6400
    description: IPv4 loopback only
  - url: http://[::1]:6400
    description: IPv6 loopback only
tags:
  - name: auth
  - name: metadata
  - name: audit
  - name: stats
  - name: collection
  - name: export
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [metadata]
      summary: Liveness without a project list
      security: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Minimal liveness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/session/pair:
    post:
      operationId: pairSession
      tags: [auth]
      summary: Exchange a one-time pairing code for a short-lived session
      security:
        - pairingCode: []
      parameters:
        - $ref: "#/components/parameters/PairingCode"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Session bearer. Not a long-term token and not returned in a URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [metadata]
      security:
        - localSession: []
      x-sbtd-scopes: [metadata:read]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/Json"
  /api/v1/openapi.json:
    get:
      operationId: getOpenApi
      tags: [metadata]
      security:
        - localSession: []
      x-sbtd-scopes: [metadata:read]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: This contract
  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [metadata]
      security:
        - localSession: []
      x-sbtd-scopes: [metadata:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/Json"
  /api/v1/actors:
    get:
      operationId: listActors
      tags: [metadata]
      security:
        - localSession: []
      x-sbtd-scopes: [metadata:read]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/Json"
  /api/v1/components:
    get:
      operationId: listComponents
      tags: [metadata]
      security:
        - localSession: []
      x-sbtd-scopes: [metadata:read]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/Json"
  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [audit]
      security:
        - localSession: []
      x-sbtd-scopes: [tasks:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
