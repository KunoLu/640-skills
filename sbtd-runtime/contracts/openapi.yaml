  /api/v1/metrics/catalog:
    get:
      operationId: getMetricCatalog
      tags: [stats]
      x-sbtd-implementation: library
      summary: Implemented as stats_query.serve_catalog (in-process, no HTTP server).
      security:
        - localSession: []
