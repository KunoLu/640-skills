  /api/v1/validations:
    get:
      operationId: listValidations
      tags: [audit]
      security:
        - localSession: []
      x-sbtd-scopes: [audit:read]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
