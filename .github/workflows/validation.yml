name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install declared Onboard dependencies
        run: python -m pip install -r sbtd-workflow-onboard/requirements.txt

      - name: Check Python and installer syntax
        run: |
          python -m compileall -q sbtd-workflow-onboard/scripts tests
          bash -n install.sh

      - name: Run the full unit and contract suite
        run: python -B -m unittest discover -s tests -p 'test_*.py'

      - name: Verify the checkout stayed clean
        run: test -z "$(git status --porcelain)"

  macos-bash-installer:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install declared Onboard dependencies
        run: python -m pip install -r sbtd-workflow-onboard/requirements.txt

      - name: Check Python and installer syntax
        run: |
          python -m compileall -q sbtd-workflow-onboard/scripts tests
          /bin/bash -n install.sh

      - name: Run macOS Bash installer and workflow contracts
        run: >-
          python -B -m unittest
          tests.test_install_sh_agent_cli_flow.BashInstallerAgentCliFlowTests
          tests.test_onboard_multi_projects
          tests.test_workflow_contracts

      - name: Verify the checkout stayed clean
        run: test -z "$(git status --porcelain)"

  windows-powershell-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install declared Onboard dependencies
        run: python -m pip install -r sbtd-workflow-onboard/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q sbtd-workflow-onboard/scripts tests

      - name: Run Windows PowerShell installer and workflow contracts
        run: python -B -m unittest tests.test_install_sh_agent_cli_flow.PowerShellInstallerAgentCliFlowTests tests.test_workflow_contracts

      - name: Run the real pwsh installer subset when available
        run: python -B -m unittest -k powershell tests.test_install_sh_agent_cli_flow

      - name: Reject native Windows migration junction traversal
        run: >-
          python -B -m unittest
          tests.test_sbtd_migration_files.MigrationFileTests.test_windows_junction_is_rejected_before_snapshot_or_copy_reads_target

      - name: Verify the checkout stayed clean
        run: test -z "$(git status --porcelain)"
